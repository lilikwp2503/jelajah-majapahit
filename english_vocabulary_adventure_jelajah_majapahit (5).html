<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Vocabulary Adventure - Jelajah Majapahit</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome untuk Ikon Game -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts: Fredoka & Nunito -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background: radial-gradient(circle at 18% 12%, #fef9c3 0%, transparent 42%),
                        radial-gradient(circle at 85% 18%, #bae6fd 0%, transparent 48%),
                        linear-gradient(180deg, #38bdf8 0%, #7dd3fc 32%, #fef3c7 78%, #fde68a 100%);
            background-attachment: fixed;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }
        .font-game {
            font-family: 'Fredoka', cursive, sans-serif;
        }
        /* Transisi & Efek Kilau Halus pada Tombol */
        .btn-game {
            position: relative;
            overflow: hidden;
            transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1),
                        box-shadow 0.22s cubic-bezier(0.22, 1, 0.36, 1),
                        filter 0.22s ease;
            box-shadow: 0 5px 0 rgba(120, 53, 15, 0.25), 0 10px 20px -5px rgba(0, 0, 0, 0.15);
        }
        .btn-game::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 60%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.28), transparent);
            transform: skewX(-20deg);
            transition: left 0.55s ease;
            pointer-events: none;
        }
        .btn-game:hover:not(:disabled)::after {
            left: 140%;
        }
        .btn-game:hover:not(:disabled) {
            transform: translateY(-3px) scale(1.01);
            box-shadow: 0 7px 0 rgba(120, 53, 15, 0.25), 0 14px 24px -4px rgba(0, 0, 0, 0.2);
            filter: brightness(1.03);
        }
        .btn-game:active:not(:disabled) {
            transform: translateY(2px) scale(0.99);
            box-shadow: 0 2px 0 rgba(120, 53, 15, 0.25);
        }
        /* Kartu Misi Smooth Hover */
        .mission-card {
            transition: transform 0.32s cubic-bezier(0.22, 1, 0.36, 1),
                        box-shadow 0.32s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .mission-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 32px -10px rgba(120, 53, 15, 0.28);
        }
        .svg-scene svg {
            shape-rendering: geometricPrecision;
            transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .mission-card:hover .svg-scene svg {
            transform: scale(1.04);
        }
        @keyframes floatSlow {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(1.2deg); }
        }
        .float-anim {
            animation: floatSlow 3.8s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
        }
        @keyframes driftCloud {
            0%, 100% { transform: translateX(0px); }
            50% { transform: translateX(18px); }
        }
        .cloud-drift {
            animation: driftCloud 14s ease-in-out infinite;
        }
        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.45), 0 12px 24px -6px rgba(180, 83, 9, 0.25); }
            50% { box-shadow: 0 0 0 10px rgba(245, 158, 11, 0), 0 16px 28px -6px rgba(180, 83, 9, 0.32); }
        }
        .pulse-glow {
            animation: pulseGlow 2.4s ease-in-out infinite;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px) scale(0.985); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .animate-fade-in {
            animation: fadeIn 0.42s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        @media print {
            body * {
                visibility: hidden;
            }
            #certificatePrintable, #certificatePrintable * {
                visibility: visible;
            }
            #certificatePrintable {
                position: fixed;
                left: 0;
                top: 0;
                width: 100%;
                box-shadow: none !important;
                border-width: 6px !important;
            }
            .no-print {
                display: none !important;
            }
        }

</head>

                        Jelajah Majapahit
                    </div>
                    <div class="text-[11px] text-amber-100/90 font-semibold mt-0.5">
                        SDN Gemekan • PGRI Cabang Sooko
                    </div>
                </div>
            </div>

            <!-- Kanan: HUD Bintang, Skor, & Tombol Suara -->
            <div class="flex items-center gap-2 sm:gap-3">

                        <span id="starCount">0</span><span>/25</span>

                        <i class="fa-solid fa-coins text-yellow-300"></i>
                        <span id="scoreCount">0</span>
                    </div>

                    <i class="fa-solid fa-volume-high"></i>
                </button>
            </div>
        </div>
    </header>

           6. STATE & AUDIO SYSTEM (WEB AUDIO API + SPEECH SYNTHESIS)
           ============================================================================ */
        const state = {
            screen: 'home', // 'home' | 'map' | 'quiz' | 'complete'
            playerName: '',
            playerSchool: '',
            grade: '1',
            score: 0,
            stars: 0,

            selectedOption: null,
            soundEnabled: true
        };

        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSfx(type) {
            if (!state.soundEnabled) return;
            try {
                initAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                const now = audioCtx.currentTime;

                if (type === 'click') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(520, now);
                    osc.frequency.exponentialRampToValueAtTime(780, now + 0.08);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                    osc.start(now);
                    osc.stop(now + 0.08);
                } else if (type === 'correct') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, now);
                    osc.frequency.setValueAtTime(659.25, now + 0.1);
                    osc.frequency.setValueAtTime(783.99, now + 0.2);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
                    osc.start(now);
                    osc.stop(now + 0.35);
                } else if (type === 'wrong') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(240, now);
                    osc.frequency.linearRampToValueAtTime(170, now + 0.25);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                    osc.start(now);
                    osc.stop(now + 0.25);
                } else if (type === 'win') {
                    osc.type = 'triangle';
                    [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
                        osc.frequency.setValueAtTime(freq, now + i * 0.11);
                    });
                    gain.gain.setValueAtTime(0.22, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.55);
                    osc.start(now);
                    osc.stop(now + 0.55);
                }
            } catch (e) {
                console.warn("Audio SFX:", e);
            }
        }

        function speakEnglish(text) {
            if (!state.soundEnabled) return;
            try {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const utter = new SpeechSynthesisUtterance(text);
                    utter.lang = 'en-US';
                    utter.rate = 0.88;
                    window.speechSynthesis.speak(utter);
                }
            } catch (e) {
                console.warn("Speech synthesis:", e);
            }
        }

        function toggleSound() {
            state.soundEnabled = !state.soundEnabled;
            const btn = document.getElementById('btnSound');
            btn.innerHTML = state.soundEnabled
                ? '<i class="fa-solid fa-volume-high"></i>'
                : '<i class="fa-solid fa-volume-xmark"></i>';
            showToast(state.soundEnabled ? "Suara diaktifkan" : "Suara dimatikan", "info");
        }

        function showToast(msg, type = "info") {
            const box = document.getElementById('toastBox');
            const content = document.getElementById('toastContent');
            const colors = {
                info: "bg-sky-900 text-sky-100 border-sky-400",
                success: "bg-emerald-900 text-emerald-100 border-emerald-400",
                warning: "bg-amber-900 text-amber-100 border-amber-400"
            };
            content.className = `px-4 py-3 rounded-2xl shadow-xl font-bold text-sm flex items-center gap-2.5 border-2 ${colors[type] || colors.info}`;
            content.innerHTML = `<i class="fa-solid fa-bell"></i> <span>${msg}</span>`;
            box.classList.remove('hidden');
            clearTimeout(window._toastTimer);
            window._toastTimer = setTimeout(() => {
                box.classList.add('hidden');
            }, 2600);
        }

        function escapeHtml(str) {
            return String(str || '')
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function startAdventure(grade) {
            initAudio();
            playSfx('click');

            const nameEl = document.getElementById('playerNameInput');
            const schoolEl = document.getElementById('playerSchoolInput');
            const rawName = nameEl ? nameEl.value.trim() : '';
            const rawSchool = schoolEl ? schoolEl.value.trim() : '';

            if (!rawName) {
                showToast("Tulis nama lengkapmu dulu ya, Rek!", "warning");
                if (nameEl) nameEl.focus();
                return;
            }

            if (!rawSchool) {
                showToast("Isi asal sekolahmu dulu ya, Rek!", "warning");
                if (schoolEl) schoolEl.focus();
                return;
            }

            state.playerName = rawName;
            state.playerSchool = rawSchool;
            state.grade = grade;
            state.score = 0;
            state.stars = 0;
            state.completedMissions = [];
            state.screen = 'map';
            renderApp();
        }

        /* ============================================================================
           8. RENDER LAYAR: PETA PETUALANGAN (MAP)
           ============================================================================ */

                                <i class="fa-solid fa-user-graduate"></i>
                            </div>
                            <div>
                                <div class="flex flex-wrap items-center gap-1.5">
                                    <h2 class="font-game text-lg sm:text-xl font-bold text-amber-950 leading-tight">${escapeHtml(state.playerName)}</h2>
                                    <span class="px-2 py-0.5 rounded-full bg-amber-100 text-amber-800 border border-amber-300 text-[11px] font-extrabold">${gradeLabel}</span>
                                </div>
                                <p class="text-xs text-slate-600 font-semibold">
                                    <i class="fa-solid fa-school text-emerald-600 mr-1"></i>${escapeHtml(state.playerSchool)} • Misi: <b>${totalDone}/5 Selesai</b>
                                </p>
                            </div>
                        </div>

                        <div class="flex items-center gap-2">

                                <i class="fa-solid fa-book"></i> <span>Kamus</span>
                            </button>

                                <i class="fa-solid fa-house"></i> <span>Beranda</span>

                    <!-- Banner Perayaan Jika 5 Misi Selesai -->
                    ${allFinished ? `

                                <i class="fa-solid fa-certificate text-lg"></i> Cetak Sertifikat Kelulusan

                        </div>

                    <!-- Grid Kartu 5 Misi Situs Mojokerto -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">

                            const isUnlocked = idx === 0 || state.completedMissions.includes(MISSIONS[idx - 1].id);

                                ? `<span class="px-2.5 py-1 rounded-full bg-emerald-500 text-white text-xs font-bold flex items-center gap-1"><i class="fa-solid fa-check-circle"></i> Selesai</span>`

                                            <p class="text-xs text-slate-600 mt-2 leading-relaxed">${m.fact}</p>

                                    <!-- Tombol Mulai Misi -->
                                    <div class="px-4 pb-4">
                                        <button onclick="selectMission(${m.id})" ${!isUnlocked ? 'disabled' : ''}

                                                isCompleted
                                                    ? 'bg-emerald-100 text-emerald-800 border-2 border-emerald-400 hover:bg-emerald-200'
                                                    : isUnlocked
                                                        ? 'bg-gradient-to-b from-amber-400 to-orange-500 text-white border-2 border-amber-200 shadow-md'

                                            <span>${isCompleted ? 'Mainkan Ulang' : isUnlocked ? 'Jelajahi Situs' : 'Selesaikan Misi Sebelumnya'}</span>

        function selectMission(missionId) {
            playSfx('click');
            const mission = MISSIONS.find(m => m.id === missionId);
            if (!mission) return;

            state.currentMission = mission;
            state.currentQuestions = QUESTION_BANK[state.grade][missionId] || QUESTION_BANK['1'][missionId];
            state.questionIndex = 0;
            state.missionCorrectCount = 0;
            state.selectedOption = null;
            state.screen = 'quiz';
            renderApp();
        }

        /* ============================================================================
           9. RENDER LAYAR: TANTANGAN KUIS KOSAKATA (FULL ENGLISH TANPA BOCORAN AUDIO)
           ============================================================================ */
        function renderQuizScreen() {
            const m = state.currentMission;

            const totalQ = state.currentQuestions.length;
            const answered = state.selectedOption !== null;
            const isCorrect = answered && state.selectedOption === q.answer;

                    <!-- Bar Navigasi Atas -->
                    <div class="flex items-center justify-between gap-2 bg-white/95 px-4 py-2.5 rounded-2xl border-2 border-amber-400 shadow">
                        <button onclick="backToMap()" class="text-xs sm:text-sm font-bold text-slate-600 hover:text-amber-700 flex items-center gap-1.5">
                            <i class="fa-solid fa-arrow-left"></i> Kembali ke Peta
                        </button>
                        <div class="flex items-center gap-1.5">
                            ${state.currentQuestions.map((_, i) => `
                                <span class="w-6 h-2.5 rounded-full ${

                    <!-- Kartu Utama Kuis -->
                    <div class="bg-white/95 backdrop-blur-md rounded-3xl border-4 border-amber-500 shadow-2xl overflow-hidden">

                            <div class="absolute bottom-3 left-4 right-4 flex items-end justify-between gap-2">
                                <div class="text-white">
                                    <span class="px-2 py-0.5 rounded bg-amber-500 text-amber-950 text-[10px] font-extrabold uppercase">Misi ${m.number} • Kelas ${state.grade}</span>

                                <div class="w-16 h-16 sm:w-20 sm:h-20 shrink-0 -mb-2 drop-shadow-lg">
                                    ${SVG_ASSETS.prince}

                            </div>
                        </div>

                        <!-- Area Pertanyaan (100% Bahasa Inggris) -->
                        <div class="p-5 sm:p-6">
                            <div class="bg-amber-50 border-2 border-amber-300 rounded-2xl p-4 mb-5">
                                <p class="text-base sm:text-lg font-extrabold text-slate-900 leading-snug">
                                    ${q.prompt}
                                </p>
                            </div>

                            <!-- 4 Pilihan Jawaban (100% Bahasa Inggris) -->
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                ${q.options.map((opt, idx) => {
                                    let btnStyle = "bg-white hover:bg-amber-50 border-slate-300 text-slate-800";
                                    let badgeStyle = "bg-amber-100 text-amber-800";
                                    let iconHtml = "";

                                    if (answered) {
                                        if (idx === q.answer) {
                                            btnStyle = "bg-emerald-500 border-emerald-700 text-white";
                                            badgeStyle = "bg-white text-emerald-700";
                                            iconHtml = `<i class="fa-solid fa-circle-check text-xl"></i>`;
                                        } else if (idx === state.selectedOption) {
                                            btnStyle = "bg-rose-500 border-rose-700 text-white";
                                            badgeStyle = "bg-white text-rose-700";
                                            iconHtml = `<i class="fa-solid fa-circle-xmark text-xl"></i>`;
                                        } else {
                                            btnStyle = "bg-slate-100 border-slate-200 text-slate-400 opacity-70";
                                        }
                                    }

                                    const letters = ["A", "B", "C", "D"];
                                    return `
                                        <button onclick="chooseAnswer(${idx})" ${answered ? 'disabled' : ''}
                                            class="btn-game p-3.5 rounded-2xl border-3 border-2 font-bold text-left flex items-center justify-between gap-3 ${btnStyle}">
                                            <div class="flex items-center gap-3">
                                                <span class="w-8 h-8 rounded-xl ${badgeStyle} font-extrabold flex items-center justify-center shrink-0 text-sm">

                                                <span class="text-sm sm:text-base">${opt}</span>
                                            </div>
                                            ${iconHtml}
                                        </button>
                                    `;
                                }).join('')}

                            <!-- Umpan Balik & Audio Pelafalan Muncul Setelah Dijawab -->
                            ${answered ? `
                                <div class="mt-5 p-4 rounded-2xl border-2 ${isCorrect ? 'bg-emerald-50 border-emerald-400 text-emerald-950' : 'bg-rose-50 border-rose-400 text-rose-950'} animate-fade-in">
                                    <div class="flex flex-wrap items-center justify-between gap-2 mb-1.5">
                                        <div class="flex items-center gap-2 font-extrabold text-base">
                                            <i class="fa-solid ${isCorrect ? 'fa-star text-amber-500' : 'fa-lightbulb text-amber-600'}"></i>
                                            <span>${isCorrect ? 'Hebat! Jawabanmu Benar (+20 Poin)' : 'Hampir Tepat! Ayo Pelajari Jawabannya:'}</span>
                                        </div>
                                        <button onclick="speakEnglish('${q.word.replace(/'/g, "\\'")}')"
                                            class="px-3 py-1 rounded-full bg-sky-600 hover:bg-sky-700 text-white text-xs font-extrabold flex items-center gap-1.5 shadow">

                                    </div>

                                    <div class="mt-4 flex justify-end">

                                            <span>${state.questionIndex + 1 < totalQ ? 'Soal Berikutnya' : 'Selesaikan Misi'}</span>
                                            <i class="fa-solid fa-arrow-right"></i>
                                        </button>
                                    </div>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                </div>
            `;
        }

        function chooseAnswer(idx) {
            if (state.selectedOption !== null) return;
            state.selectedOption = idx;
            const q = state.currentQuestions[state.questionIndex];

            if (idx === q.answer) {
                playSfx('correct');
                state.score += 20;
                state.missionCorrectCount += 1;
            } else {
                playSfx('wrong');
            }

            // Putar pelafalan Bahasa Inggris hanya SETELAH siswa menjawab
            setTimeout(() => speakEnglish(q.word), 250);
            renderApp();
        }

        function nextQuestion() {
            playSfx('click');
            if (state.questionIndex + 1 < state.currentQuestions.length) {
                state.questionIndex += 1;
                state.selectedOption = null;
                renderApp();
            } else {
                finishMission();
            }
        }

        function finishMission() {
            playSfx('win');
            const mId = state.currentMission.id;
            if (!state.completedMissions.includes(mId)) {
                state.completedMissions.push(mId);
                state.stars += state.missionCorrectCount;
            }
            state.screen = 'complete';
            renderApp();
        }

        /* ============================================================================
           10. RENDER LAYAR: SELESAI MISI (SERTIFIKAT MUNCUL DI AKHIR MISI KE-5)
           ============================================================================ */
        function renderCompleteScreen() {
            const m = state.currentMission;
            const totalQ = state.currentQuestions.length;
            const isFinalMission = m.id === 5 || state.completedMissions.length === MISSIONS.length;

            return `
                <div class="w-full max-w-2xl mx-auto bg-white/95 backdrop-blur-md rounded-3xl border-4 border-amber-500 shadow-2xl p-6 sm:p-8 text-center animate-fade-in">
                    <div class="w-24 h-24 mx-auto mb-3 float-anim">

                    </div>

                    <span class="px-3 py-1 rounded-full bg-emerald-100 text-emerald-800 border border-emerald-400 text-xs font-extrabold uppercase">

                    </h2>

                    </p>

                    <!-- Perolehan Bintang Misi (5 Bintang) -->
                    <div class="flex items-center justify-center gap-2 sm:gap-3 my-5">
                        ${[1, 2, 3, 4, 5].map(n => `
                            <div class="w-12 h-12 sm:w-14 sm:h-14 rounded-2xl flex items-center justify-center text-2xl sm:text-3xl border-2 shadow-md ${
                                n <= state.missionCorrectCount
                                    ? 'bg-amber-400 border-amber-200 text-white'
                                    : 'bg-slate-100 border-slate-300 text-slate-300'
                            }">
                                <i class="fa-solid fa-star"></i>
                            </div>
                        `).join('')}
                    </div>

                    <div class="bg-amber-50 border-2 border-amber-300 rounded-2xl p-4 mb-6 text-xs sm:text-sm text-amber-950">
                        <p class="font-bold mb-1"><i class="fa-solid fa-landmark text-amber-700 mr-1"></i> Tahukah Kamu?</p>
                        <p>${m.fact}</p>
                    </div>

                    <div class="flex flex-wrap items-center justify-center gap-3">
                        <button onclick="backToMap()" class="btn-game px-5 py-3 rounded-2xl bg-gradient-to-b from-emerald-500 to-emerald-700 border-2 border-emerald-300 text-white font-extrabold text-sm sm:text-base flex items-center gap-2">

                        </button>
                        ${isFinalMission ? `
                            <button onclick="openCertificateModal()" class="btn-game px-5 py-3 rounded-2xl bg-gradient-to-b from-amber-300 to-amber-500 border-2 border-amber-200 text-amber-950 font-extrabold text-sm sm:text-base flex items-center gap-2 pulse-glow">

        function backToMap() {
            playSfx('click');
            state.screen = 'map';
            renderApp();

        function goHome() {
            playSfx('click');
            state.screen = 'home';
            renderApp();
        }

        /* ============================================================================
           11. MODAL SERTIFIKAT PENGHARGAAN & CETAK / UNDUH PNG (TANPA TTD & KURIKULUM)
           ============================================================================ */
        function getPredicateTitle(stars, completedCount) {
            if (completedCount === 5 && stars >= 22) return "MAHA DUTA KEARIFAN MAJAPAHIT";
            if (stars >= 16) return "KSATRIA MUDA MAJAPAHIT";
            if (stars >= 10) return "PENJELAJAH BERBAKAT MOJOKERTO";
            return "PETUALANG MUDA MOJOKERTO";
        }

        function openCertificateModal() {
            playSfx('win');
            const existing = document.getElementById('certificateModal');
            if (existing) existing.remove();

            const nameDisplay = escapeHtml(state.playerName || "Siswa Petualang");
            const schoolDisplay = escapeHtml(state.playerSchool || "SDN Gemekan Mojokerto");
            const gradeText = `Kelas ${state.grade} SD (Semester 1)`;
            const completedCount = state.completedMissions.length;
            const predicate = getPredicateTitle(state.stars, completedCount);
            const todayStr = new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
            const certNumber = `NO: 421.2/${100 + state.score}/SDN-GMK/${new Date().getFullYear()}`;

            const modal = document.createElement('div');
            modal.id = 'certificateModal';
            modal.className = 'fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-3 sm:p-5 overflow-y-auto animate-fade-in';
            modal.innerHTML = `
                <div class="w-full max-w-3xl my-auto flex flex-col gap-3">

        function downloadCertificatePng() {
            try {
                const canvas = document.createElement('canvas');
                canvas.width = 1400;
                canvas.height = 980;
                const ctx = canvas.getContext('2d');

                // Latar gradien krem emas
                const bgGrad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
                bgGrad.addColorStop(0, '#fffbeb');
                bgGrad.addColorStop(0.5, '#fff7ed');
                bgGrad.addColorStop(1, '#fef3c7');
                ctx.fillStyle = bgGrad;
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Bingkai luar & dalam Majapahit
                ctx.strokeStyle = '#b45309';
                ctx.lineWidth = 18;
                ctx.strokeRect(28, 28, canvas.width - 56, canvas.height - 56);

                ctx.strokeStyle = '#f59e0b';
                ctx.lineWidth = 5;
                ctx.strokeRect(52, 52, canvas.width - 104, canvas.height - 104);

                // Gambar Kedua Logo Resmi pada Kop Sertifikat PNG
                const pgriImg = new Image();
                const sdnImg = new Image();
                const pgriSvgUrl = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(LOGO_SVG.pgri);
                const sdnSvgUrl = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(LOGO_SVG.sdnGemekan);

                let loadedCount = 0;
                const finishDrawAndDownload = () => {
                    loadedCount++;
                    if (loadedCount < 2) return;

                    ctx.drawImage(pgriImg, 120, 76, 108, 108);
                    ctx.drawImage(sdnImg, canvas.width - 228, 76, 108, 108);

                    ctx.textAlign = 'center';

                    // Kop Sertifikat
                    ctx.fillStyle = '#92400e';
                    ctx.font = 'bold 22px sans-serif';
                    ctx.fillText('PGRI CABANG SOOKO • KABUPATEN MOJOKERTO', canvas.width / 2, 120);

                    ctx.fillStyle = '#451a03';
                    ctx.font = 'bold 34px sans-serif';
                    ctx.fillText('ENGLISH VOCABULARY ADVENTURE - JELAJAH MAJAPAHIT', canvas.width / 2, 165);

                    // Garis pemisah kop
                    ctx.strokeStyle = '#f59e0b';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(140, 198);
                    ctx.lineTo(canvas.width - 140, 198);
                    ctx.stroke();

                    // Judul Utama
                    ctx.fillStyle = '#d97706';
                    ctx.font = 'bold 22px sans-serif';
                    ctx.fillText('SERTIFIKAT PENGHARGAAN', canvas.width / 2, 245);

                    ctx.fillStyle = '#451a03';
                    ctx.font = 'bold 54px sans-serif';
                    ctx.fillText('CERTIFICATE OF ACHIEVEMENT', canvas.width / 2, 305);

                    ctx.fillStyle = '#475569';
                    ctx.font = '24px sans-serif';
                    ctx.fillText('Diberikan dengan bangga kepada:', canvas.width / 2, 355);

                    // Kotak Nama & Asal Sekolah
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(220, 380, canvas.width - 440, 150);
                    ctx.strokeStyle = '#fbbf24';
                    ctx.lineWidth = 4;
                    ctx.strokeRect(220, 380, canvas.width - 440, 150);

                    const playerName = (state.playerName || 'SISWA PETUALANG').toUpperCase();
                    ctx.fillStyle = '#065f46';
                    ctx.font = 'bold 48px sans-serif';
                    ctx.fillText(playerName, canvas.width / 2, 445);

                    const playerSchool = state.playerSchool || 'SDN Gemekan Mojokerto';
                    ctx.fillStyle = '#78350f';
                    ctx.font = 'bold 30px sans-serif';
                    ctx.fillText(playerSchool, canvas.width / 2, 500);

                    const gradeText = `Kelas ${state.grade} SD (Semester 1)`;
                    ctx.fillStyle = '#334155';
                    ctx.font = '23px sans-serif';
                    ctx.fillText('Telah berhasil menyelesaikan tantangan pembelajaran Bahasa Inggris', canvas.width / 2, 575);
                    ctx.fillText(`berbasis kearifan lokal Mojokerto pada jenjang ${gradeText} dengan hasil:`, canvas.width / 2, 610);

                    const completedCount = state.completedMissions.length;
                    const predicate = getPredicateTitle(state.stars, completedCount);
                    ctx.fillStyle = '#b45309';
                    ctx.font = 'bold 30px sans-serif';
                    ctx.fillText(`★ ${predicate} ★`, canvas.width / 2, 665);

                    // Rincian Nilai
                    ctx.fillStyle = '#1e293b';
                    ctx.font = 'bold 26px sans-serif';
                    ctx.fillText(
                        `Misi Tuntas: ${completedCount}/5   |   Total Bintang: ${state.stars}/25   |   Skor Akhir: ${state.score}`,
                        canvas.width / 2,
                        735
                    );

                    // Tanggal Terbit (Tanpa TTD & Tanpa Tulisan Kurikulum)
                    const todayStr = new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
                    ctx.fillStyle = '#475569';
                    ctx.font = 'bold 22px sans-serif';
                    ctx.fillText(`Mojokerto, ${todayStr}`, canvas.width / 2, 825);

                    const link = document.createElement('a');
                    const safeFileName = (state.playerName || 'Siswa').replace(/[^a-zA-Z0-9_-]/g, '_');
                    link.download = `Sertifikat_Majapahit_${safeFileName}.png`;
                    link.href = canvas.toDataURL('image/png');
                    link.click();

                    showToast("Sertifikat berhasil diunduh!", "success");
                };

                pgriImg.onload = finishDrawAndDownload;
                sdnImg.onload = finishDrawAndDownload;
                pgriImg.src = pgriSvgUrl;
                sdnImg.src = sdnSvgUrl;
            } catch (err) {
                console.error(err);
                showToast("Gunakan tombol Cetak / PDF untuk menyimpan sertifikat.", "warning");
            }
        }

        function renderKamusItems(filter) {
            const items = filter === 'all' ? KAMUS_DATA : KAMUS_DATA.filter(item => item.grade === filter);

                <div class="p-3 rounded-2xl bg-slate-50 border-2 border-slate-200 flex items-center justify-between gap-2 hover:border-indigo-400 transition">
                    <div>
                        <div class="flex items-center gap-1.5">

                            <div class="font-extrabold text-indigo-950 text-sm">${item.en}</div>
                        </div>
                        <div class="text-xs text-slate-600 mt-0.5">ID: <b>${item.id}</b></div>
                        <div class="text-xs text-amber-800 font-semibold">JW: <i>"${item.jw}"</i></div>
                    </div>
                    <button onclick="speakEnglish('${item.en.split('/')[0].trim().replace(/'/g, "\\'")}')" class="w-9 h-9 rounded-xl bg-indigo-100 hover:bg-indigo-200 text-indigo-700 flex items-center justify-center shrink-0">
                        <i class="fa-solid fa-volume-high"></i>
                    </button>
                </div>
            `).join('');
        }

        function filterKamus(filter) {
            playSfx('click');
            currentKamusFilter = filter;
            ['all', '1', '2', '3', '4', '5', '6'].forEach(key => {
                const btn = document.getElementById(`kFilter-${key}`);
                if (!btn) return;
                btn.className = key === filter

            const container = document.getElementById('kamusListContainer');
            if (container) container.innerHTML = renderKamusItems(filter);
        }

                        <p><b><i class="fa-solid fa-book-open text-amber-600 mr-1"></i> Sumber Materi Bahasa Inggris:</b> Buku Teks Resmi <i>My Next Words</i> Kelas 1–6 SD Semester 1 (Kurikulum Merdeka — Pusat Perbukuan, Kemdikbudristek RI).</p>

        /* ============================================================================
           13. RENDER UTAMA APLIKASI & INISIALISASI
           ============================================================================ */
        function renderApp() {
            const container = document.getElementById('appContainer');
            const hud = document.getElementById('hudStats');
            const starEl = document.getElementById('starCount');
            const scoreEl = document.getElementById('scoreCount');

            if (starEl) starEl.textContent = state.stars;
            if (scoreEl) scoreEl.textContent = state.score;

            if (state.screen === 'home') {
                hud.classList.add('hidden');
                hud.classList.remove('flex');
                container.innerHTML = renderHomeScreen();
            } else {
                hud.classList.remove('hidden');
                hud.classList.add('flex');
                if (state.screen === 'map') {
                    container.innerHTML = renderMapScreen();
                } else if (state.screen === 'quiz') {
                    container.innerHTML = renderQuizScreen();
                } else if (state.screen === 'complete') {
                    container.innerHTML = renderCompleteScreen();
                }
            }
        }

        window.onload = function () {
            document.getElementById('logoPgriContainer').innerHTML = LOGO_SVG.pgri;
            document.getElementById('logoSdnContainer').innerHTML = LOGO_SVG.sdnGemekan;
            renderApp();
        };
